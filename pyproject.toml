[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epichron"
version = "0.1.0"
description = "Horloge épigénétique : prédire l'âge biologique à partir de la méthylation de l'ADN"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
ml = ["scikit-learn", "lightgbm", "shap", "matplotlib"]
dev = ["pytest", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
